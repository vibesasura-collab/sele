name: Arena Bot

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Type RUN to start arena bot"
        required: true
        default: "RUN"
  schedule:
    # Runs automatically every day at 12:00 PM UTC
    - cron: '0 12 * * *'

jobs:
  run-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate trigger source
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Mode: ${{ github.event.inputs.run_mode }}"
            if [ "${{ github.event.inputs.run_mode }}" != "RUN" ]; then
              echo "Not authorized run. Exiting."
              exit 1
            fi
          else
            echo "Scheduled run, proceeding..."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Build Project
        run: mvn -U -B clean compile -Dmaven.wagon.http.retryHandler.count=5

      - name: Run Arena Bot
        env:
          GAME_ID: ${{ secrets.GAME_ID }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: mvn -B exec:java -Dexec.mainClass=ArenaMain
