- name: Run Bot Loop with Time Control
  env:
    GAME_ID: ${{ secrets.GAME_ID }}
    GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
  run: |
    mvn -B clean compile

    while true
    do
      echo "🚀 Starting 5h 55m session..."

      START_TIME=$(date +%s)
      END_TIME=$((START_TIME + 21300))  # 5 hr 55 min = 21300 sec

      while [ $(date +%s) -lt $END_TIME ]
      do
        echo "▶ Running bot cycle..."

        mvn -B exec:java \
          -Dexec.mainClass=Main \
          -Dexec.classpathScope=compile \
          -Dexec.cleanupDaemonThreads=false

        echo "🔁 Restarting bot..."
        sleep 5
      done

      echo "⏸ Session complete. Sleeping 10 minutes..."
      sleep 600
    done
