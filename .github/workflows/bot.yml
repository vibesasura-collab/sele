name: Selenium Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # max allowed (~6 hours)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install -y wget curl unzip gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/googlechrome-linux-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/googlechrome-linux-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt update
          sudo apt install -y google-chrome-stable

      # 🔥 MAIN LOOP (IMPORTANT)
      - name: Run bot continuously
        env:
          GAME_ID: ${{ secrets.GAME_ID }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: |
          while true
          do
            echo "Starting bot run..."
            mvn -B compile exec:java -Dexec.mainClass=Main
            echo "Bot finished. Restarting in 5 seconds..."
            sleep 5
          done
