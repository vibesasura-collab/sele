on:
  workflow_dispatch:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Kills cleanly slightly under the GitHub limit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Run Bot 1 with Maven
        env:
          GAME_ID: ${{ secrets.GAME_ID }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: mvn compile exec:java -Dexec.mainClass=Main

      - name: Run Bot 2 with Maven
        env:
          GAME_ID: ${{ secrets.GAME_ID2 }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD2 }}
        run: mvn compile exec:java -Dexec.mainClass=Main
