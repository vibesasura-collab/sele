name: Selenium Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub max (~6 hrs)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install -y wget curl unzip gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/googlechrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/googlechrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt update
          sudo apt install -y google-chrome-stable

      # 🔥 CONTROLLED LOOP
      - name: Run bot in 6hr cycle
        env:
          GAME_ID: ${{ secrets.GAME_ID }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: |
          while true
          do
            echo "🚀 Starting bot (5h 50m run)..."

            timeout 21000 mvn -B compile exec:java -Dexec.mainClass=Main || true
            # 21000 sec = 5h 50m

            echo "😴 Resting for 10 minutes..."
            sleep 600

            echo "🔁 Restarting cycle..."
          done
