on:
  workflow_dispatch:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false # Prevents one failing bot from canceling the other
      matrix:
        account:
          - id_key: GAME_ID
            pass_key: GAME_PASSWORD
          - id_key: GAME_ID2
            pass_key: GAME_PASSWORD2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Run Bot with Maven
        env:
          GAME_ID: ${{ secrets[matrix.account.id_key] }}
          GAME_PASSWORD: ${{ secrets[matrix.account.pass_key] }}
        run: mvn compile exec:java -Dexec.mainClass=Main
